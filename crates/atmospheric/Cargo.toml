[package]
name = "atmospheric"
authors = ["Ewan Croft (ewanc26)"]
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "AT Protocol client logic for the atmospheric Horizon mod — builds and tests without a game"

[dependencies]
# AT Protocol: generated lexicon types, the agent with session handling, and
# the reqwest-backed XRPC client. The `bluesky` feature is required:
# app.bsky.feed.post and app.bsky.notification.listNotifications are app.bsky
# lexicons, so com.atproto alone does not cover posting.
atrium-api = { version = "0.26", features = ["agent", "bluesky"] }
atrium-xrpc-client = { version = "0.5", default-features = false, features = ["reqwest"] }
# Named directly for the `Store` trait behind the custom OAuth session store
# and the `http` types behind the custom DPoP XRPC client.
atrium-common = "0.1"
atrium-xrpc = "0.12"

# TLS: the xrpc client's `reqwest` feature brings reqwest with no TLS backend
# at all, so rustls is enabled here by feature unification. WebPKI roots keep
# the build free of system TLS libraries on every platform.
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls-webpki-roots"] }

# Async runtime: only the worker thread ever builds one.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Colibri event stream (M26): a client WebSocket with rustls, matching the
# reqwest TLS stack. `futures-util` supplies the Sink/Stream combinators the
# tungstenite socket is driven with.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Settings and session-file serialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ed25519 endorsement signing for at.atpcraft.player.snapshot records
# (BSD-3-Clause; sha2/base64 are MIT OR Apache-2.0 — all AGPL-compatible).
# Pure Rust, so players' machines need no system crypto libraries.
ed25519-dalek = { version = "3", features = ["rand_core"] }
sha2 = "0.11"
base64 = "0.23"
# System randomness for a fresh signing seed; its rand_core re-export is the
# 0.10 line ed25519-dalek 3 signs with. MIT OR Apache-2.0.
getrandom = "0.4"

# ES256 (ECDSA P-256) keys and signatures for DPoP proofs in the OAuth flow
# (M8). RustCrypto crates are MIT OR Apache-2.0 — AGPL-compatible, pure Rust.
# Randomness comes from p256's own re-exported rand_core 0.9 `OsRng`.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }

# K-256 (secp256k1) verification for AT Protocol commit signatures (#185).
# AT Protocol repository commits are ECDSA-signed with the DID's PLC-anchored
# k256 key. RustCrypto crates are MIT OR Apache-2.0 — AGPL-compatible, pure Rust.
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std"] }

# DAG-CBOR / CID decoding for signed commit hashing and CAR block walking (#185).
# `multibase` decodes `z…` multikey public keys; `cid` reads CIDs from CAR
# frames. `serde_ipld_dagcbor` is only needed if we switch from the hand-rolled
# canonical encoder; the commit input is encoded with the local DAG-CBOR helpers.
multibase = "0.9"
cid = "0.11"

# Errors.
thiserror = "2"
