[package]
name = "atmospheric-server"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "Server-side player identity linking for atmospheric-horizon"

[dependencies]
axum = "0.8"
base64 = "0.22"
# Label signing (M56): secp256k1 ECDSA and multibase did:key encoding for the
# labeler's #atproto_label key. RustCrypto, MIT OR Apache-2.0.
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
bs58 = "0.5"
# queryLabels array parameters (repeated keys and comma-separated values).
form_urlencoded = "1"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
