[package]
name = "atmospheric-server"
authors = ["Ewan Croft (ewanc26)"]
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "Server-side player identity linking for atmospheric-horizon"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
# Skin record signing reuses the game worker's exact atpcraft record types and
# Ed25519 canonical payload; the server never reimplements that wire format.
atmospheric = { path = "../atmospheric" }
atrium-api = "0.26"
base64 = "0.23"
# Label signing (M56): secp256k1 ECDSA and multibase did:key encoding for the
# labeler's #atproto_label key. RustCrypto, MIT OR Apache-2.0.
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std", "getrandom"] }
bs58 = "0.5"
# queryLabels array parameters (repeated keys and comma-separated values).
form_urlencoded = "1"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
# Permissive CORS for the public labeler XRPC reads.
tower-http = { version = "0.7", features = ["cors"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
