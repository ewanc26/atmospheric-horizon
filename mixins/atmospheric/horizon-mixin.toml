[mod]
id = "atmospheric"
version = "0.3.1"
priority = 100

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "atmospheric"
source = "runtime.rs"

# The hooks below are Horizon's named native hook points
# (native-hooks.json at the pinned revision), not raw targets.

# The mod's row in Options > Mods, with the keybind the player can rebind.
[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

# The keybinds: post the player's location, or the latest F2 screenshot.
[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# Remember each finished F2 screenshot's path for the post-screenshot
# keybind (a raw target, not one of the named hook points).
[[injection]]
id = "screenshot"
kind = "HEAD"
target = "horizon_client::game::chat::Game<'_>::finish_screenshot"
helper = "shot.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "saved", ty = "&horizon_client::gfx::SavedScreenshot", value = "&saved" },
]

# /atmospheric login and /atmospheric post <text>.
[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Every chat line the player submits (a raw target, not one of the named hook
# points, like the screenshot one): mirrored to the worker for
# at.atpcraft.player.chat records when chat publishing is enabled.
[[injection]]
id = "chat"
kind = "HEAD"
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
helper = "chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]

# System messages (HEAD of system_message is injectable; death_message itself
# is not — it contains control flow the injector rejects). Only translatable
# "death.*" messages are posted, when post_death_messages is enabled.
[[injection]]
id = "death"
kind = "HEAD"
target = "horizon_client::game::chat::Game<'_>::system_message"
helper = "death.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "text", ty = "&horizon_client::text::Text", value = "&text" },
]

# Server broadcast lines: join/leave/death/advancement notices go to the
# bridged Colibri channel under the server account. The helper filters by the
# translation key, so ordinary chat and arbitrary server lines are ignored.
[[injection]]
id = "colibri-notice"
hook = "broadcast_message"
hook_version = 1
kind = "HEAD"
helper = "colibri/notice.rs"
bindings = [
  { name = "line", ty = "&horizon_client::text::Text", value = "&*line" },
]

# If another mod rewrites or hides the vanilla join/leave line, the connection
# event schedules a fallback notice. The worker waits three seconds and writes
# it only when no matching broadcast line arrived within five seconds.
[[injection]]
id = "colibri-join"
hook = "player_logged_in"
hook_version = 1
kind = "HEAD"
helper = "colibri/join.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

# The join gate (M38): before a server accepts the player into a level, ask the
# worker whether their linked DID is on the configured Bluesky list. The hook
# sets cancel and a disconnect reason when it is not.
[[injection]]
id = "gate-login"
hook = "player_login"
hook_version = 1
kind = "HEAD"
helper = "gate/login.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
  { name = "reason", ty = "&mut Option<horizon_client::text::Text>", value = "&mut *reason" },
]

[[injection]]
id = "colibri-leave"
hook = "player_logged_out"
hook_version = 1
kind = "HEAD"
helper = "colibri/leave.rs"
bindings = [{ name = "name", ty = "&str", value = "name" }]

# Once a tick: drain the worker's events into the HUD status line.
[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# The HUD status line, bottom-left corner.
[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]
