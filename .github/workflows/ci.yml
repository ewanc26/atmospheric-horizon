name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Source layout
        run: bash scripts/check-layout.sh

      - name: Source layout tests
        run: bash scripts/test-layout.sh

      - name: Format
        run: cargo fmt --all --check

      # Surface rustc/clippy diagnostics as check-run annotations.
      - name: Register the Rust problem matcher
        run: echo "::add-matcher::.github/problem-matcher-rust.json"

      - name: Clippy
        # Problem matchers see raw bytes, so the ANSI colours the global
        # CARGO_TERM_COLOR=always paints on would hide every diagnostic from
        # them before an annotation could exist.
        run: CARGO_TERM_COLOR=never cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  server-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the server image
        run: bash docker/server-test.sh
