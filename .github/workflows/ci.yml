name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Source layout
        run: bash scripts/check-layout.sh

      - name: Source layout tests
        run: bash scripts/test-layout.sh

      - name: Format
        run: cargo fmt --all --check

      # Surface rustc/clippy diagnostics as check-run annotations.
      - name: Register the Rust problem matcher
        run: echo "::add-matcher::.github/problem-matcher-rust.json"

      - name: Clippy
        # Problem matchers see raw bytes, so the ANSI colours the global
        # CARGO_TERM_COLOR=always paints on would hide every diagnostic from
        # them before an annotation could exist.
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Report clippy diagnostics on the pull request
        # Annotations also carry the diagnostics, but they are unreadable
        # to unauthenticated tooling, so mirror the log head onto the PR.
        if: failure() && github.event_name == 'pull_request'
        run: |
          {
            echo '### Clippy failed'
            echo
            echo '```text'
            grep -vE '^[[:space:]]*$' clippy.log | head -n 160
            echo '```'
          } > /tmp/clippy-comment.md
          gh pr comment \"$PR_NUMBER\" --body-file /tmp/clippy-comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Test
        run: cargo test --workspace --locked

  server-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the server image
        run: bash docker/server-test.sh
