[package]
name = "atmospheric-horizon"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "AT Protocol (Bluesky) integration for Horizon, the Rust rewrite of Minecraft: Java Edition"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins,
# so it must stay std-only: no external crates, no game imports. All AT Protocol
# work happens off-thread in the `atmospheric` crate (crates/atmospheric).
path = "mixins/atmospheric/runtime.rs"

[workspace]
members = ["crates/atmospheric", "crates/atmospheric-server"]
resolver = "2"
